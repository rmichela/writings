<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 770" width="900" height="770" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Coherence vs. Intrusion: four quadrants</title>
  <desc>A two-by-two grid. Coherence runs from low to high on the vertical axis and intrusion from low to high on the horizontal axis. Each quadrant shows two overlapping circles for two systems. The size of the overlap is intrusion and the sharpness of its edge is coherence. Top-left: open standard, a small sharp overlap. Top-right: opinionated platform, a large sharp overlap. Bottom-left: free-for-all, a small fuzzy overlap. Bottom-right: worst of both, a large fuzzy overlap.</desc>

  <defs>
    <!-- Blur used to make an overlap's edge fuzzy (low coherence) -->
    <filter id="fuzz" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.8"/>
    </filter>
    <!-- Left circle of each Venn, used to clip the overlap lens -->
    <clipPath id="clipTL"><circle cx="132" cy="278" r="22"/></clipPath>
    <clipPath id="clipTR"><circle cx="512" cy="278" r="22"/></clipPath>
    <clipPath id="clipBL"><circle cx="132" cy="578" r="22"/></clipPath>
    <clipPath id="clipBR"><circle cx="512" cy="578" r="22"/></clipPath>
  </defs>

  <rect width="900" height="770" fill="#ffffff"/>

  <!-- Quadrant fills -->
  <rect x="90"  y="50"  width="380" height="300" fill="#e6f4ea"/>
  <rect x="470" y="50"  width="380" height="300" fill="#e3edfa"/>
  <rect x="90"  y="350" width="380" height="300" fill="#f1f3f4"/>
  <rect x="470" y="350" width="380" height="300" fill="#fce8e6"/>

  <!-- Grid lines -->
  <rect x="90" y="50" width="760" height="600" fill="none" stroke="#5f6368" stroke-width="1.5"/>
  <line x1="470" y1="50" x2="470" y2="650" stroke="#5f6368" stroke-width="1.5"/>
  <line x1="90" y1="350" x2="850" y2="350" stroke="#5f6368" stroke-width="1.5"/>

  <!-- Top-left: open standard -->
  <g fill="#202124">
    <text x="110" y="85" font-size="18" font-weight="700" fill="#137333">OPEN STANDARD</text>
    <text x="110" y="115" font-size="14">Narrow, well-specified contracts. Anyone</text>
    <text x="110" y="135" font-size="14">can join and keep their own choices.</text>
    <text x="110" y="175" font-size="13" font-weight="700" fill="#5f6368">EXAMPLES</text>
    <text x="110" y="195" font-size="14">TCP/IP, SMTP, Unix pipes</text>
    <text x="110" y="330" font-size="14" font-style="italic" fill="#137333">"Agree on little, reuse everywhere"</text>
  </g>
  <!-- Small, sharp overlap -->
  <circle cx="132" cy="278" r="22" fill="#ffffff" fill-opacity="0.6"/>
  <circle cx="162" cy="278" r="22" fill="#ffffff" fill-opacity="0.6"/>
  <g clip-path="url(#clipTL)"><circle cx="162" cy="278" r="22" fill="#137333" fill-opacity="0.65"/></g>
  <circle cx="132" cy="278" r="22" fill="none" stroke="#3c4043" stroke-width="2"/>
  <circle cx="162" cy="278" r="22" fill="none" stroke="#3c4043" stroke-width="2"/>
  <text x="200" y="275" font-size="13" font-weight="700" fill="#3c4043">Small, sharp overlap</text>
  <text x="200" y="293" font-size="12" fill="#5f6368">Says little, says it precisely.</text>

  <!-- Top-right: opinionated platform -->
  <g fill="#202124">
    <text x="490" y="85" font-size="18" font-weight="700" fill="#1a56b0">OPINIONATED PLATFORM</text>
    <text x="490" y="115" font-size="14">A strict shared stack that buys guarantees:</text>
    <text x="490" y="135" font-size="14">determinism, noise immunity, uniform failure</text>
    <text x="490" y="155" font-size="14">handling. Intrusion is the price of admission.</text>
    <text x="490" y="195" font-size="13" font-weight="700" fill="#5f6368">EXAMPLES</text>
    <text x="490" y="215" font-size="14">CAN bus, gRPC in a monorepo,</text>
    <text x="490" y="235" font-size="14">Kubernetes</text>
    <text x="490" y="330" font-size="14" font-style="italic" fill="#1a56b0">"Welcome intrusion"</text>
  </g>
  <!-- Large, sharp overlap -->
  <circle cx="512" cy="278" r="22" fill="#ffffff" fill-opacity="0.6"/>
  <circle cx="526" cy="278" r="22" fill="#ffffff" fill-opacity="0.6"/>
  <g clip-path="url(#clipTR)"><circle cx="526" cy="278" r="22" fill="#1a56b0" fill-opacity="0.65"/></g>
  <circle cx="512" cy="278" r="22" fill="none" stroke="#3c4043" stroke-width="2"/>
  <circle cx="526" cy="278" r="22" fill="none" stroke="#3c4043" stroke-width="2"/>
  <text x="580" y="275" font-size="13" font-weight="700" fill="#3c4043">Large, sharp overlap</text>
  <text x="580" y="293" font-size="12" fill="#5f6368">Dictates a lot, precisely.</text>

  <!-- Bottom-left: free-for-all -->
  <g fill="#202124">
    <text x="110" y="385" font-size="18" font-weight="700" fill="#3c4043">FREE-FOR-ALL</text>
    <text x="110" y="415" font-size="14">Each connection is its own deal. Cheap to</text>
    <text x="110" y="435" font-size="14">start, expensive to scale. Fine for</text>
    <text x="110" y="455" font-size="14">prototypes and one-offs.</text>
    <text x="110" y="495" font-size="13" font-weight="700" fill="#5f6368">EXAMPLES</text>
    <text x="110" y="515" font-size="14">CSV file drops, screen scraping</text>
    <text x="110" y="630" font-size="14" font-style="italic" fill="#3c4043">"Pay per connection"</text>
  </g>
  <!-- Small, fuzzy overlap -->
  <circle cx="132" cy="578" r="22" fill="#ffffff" fill-opacity="0.6"/>
  <circle cx="162" cy="578" r="22" fill="#ffffff" fill-opacity="0.6"/>
  <g filter="url(#fuzz)"><g clip-path="url(#clipBL)"><circle cx="162" cy="578" r="22" fill="#5f6368" fill-opacity="0.6"/></g></g>
  <circle cx="132" cy="578" r="22" fill="none" stroke="#80868b" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="162" cy="578" r="22" fill="none" stroke="#80868b" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="200" y="575" font-size="13" font-weight="700" fill="#3c4043">Small, fuzzy overlap</text>
  <text x="200" y="593" font-size="12" fill="#5f6368">Little agreed, loosely understood.</text>

  <!-- Bottom-right: worst of both -->
  <g fill="#202124">
    <text x="490" y="385" font-size="18" font-weight="700" fill="#b3261e">WORST OF BOTH</text>
    <text x="490" y="415" font-size="14">Imposes choices without delivering a shared</text>
    <text x="490" y="435" font-size="14">foundation. You pay the cost of conformity</text>
    <text x="490" y="455" font-size="14">and still translate at every seam.</text>
    <text x="490" y="495" font-size="13" font-weight="700" fill="#5f6368">EXAMPLES</text>
    <text x="490" y="515" font-size="14">Service-provided client libraries,</text>
    <text x="490" y="535" font-size="14">video game consoles, HL7 v2</text>
    <text x="490" y="630" font-size="14" font-style="italic" fill="#b3261e">"Unwanted intrusion"</text>
  </g>
  <!-- Large, fuzzy overlap -->
  <circle cx="512" cy="578" r="22" fill="#ffffff" fill-opacity="0.6"/>
  <circle cx="526" cy="578" r="22" fill="#ffffff" fill-opacity="0.6"/>
  <g filter="url(#fuzz)"><g clip-path="url(#clipBR)"><circle cx="526" cy="578" r="22" fill="#b3261e" fill-opacity="0.6"/></g></g>
  <circle cx="512" cy="578" r="22" fill="none" stroke="#80868b" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="526" cy="578" r="22" fill="none" stroke="#80868b" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="580" y="575" font-size="13" font-weight="700" fill="#3c4043">Large, fuzzy overlap</text>
  <text x="580" y="593" font-size="12" fill="#5f6368">Dictates a lot, vaguely.</text>

  <!-- Vertical axis (Coherence) -->
  <g fill="#202124" text-anchor="middle">
    <text transform="translate(34 350) rotate(-90)" font-size="16" font-weight="700" letter-spacing="2">COHERENCE</text>
    <text transform="translate(66 80) rotate(-90)" font-size="13" fill="#5f6368">HIGH</text>
    <text transform="translate(66 620) rotate(-90)" font-size="13" fill="#5f6368">LOW</text>
  </g>

  <!-- Horizontal axis (Intrusion) -->
  <g fill="#202124" text-anchor="middle">
    <text x="470" y="707" font-size="16" font-weight="700" letter-spacing="2">INTRUSION</text>
    <text x="130" y="682" font-size="13" fill="#5f6368">LOW</text>
    <text x="810" y="682" font-size="13" fill="#5f6368">HIGH</text>
  </g>
  <line x1="190" y1="678" x2="750" y2="678" stroke="#9aa0a6" stroke-width="1.5"/>
  <polygon points="190,673 180,678 190,683" fill="#9aa0a6"/>
  <polygon points="750,673 760,678 750,683" fill="#9aa0a6"/>

  <!-- Legend for the circles -->
  <g fill="#5f6368" font-size="12.5" font-style="italic" text-anchor="middle">
    <text x="470" y="738">Each pair of circles is two systems, and the overlap is what they must agree on.</text>
    <text x="470" y="756">Overlap size is intrusion. Edge sharpness is coherence.</text>
  </g>
</svg>
