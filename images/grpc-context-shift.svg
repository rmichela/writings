<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 740" width="900" height="740" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>The same technology lands in a different quadrant with context</title>
  <desc>The quadrant chart of coherence versus intrusion. gRPC inside a monorepo sits in the high coherence, high intrusion quadrant. An arrow straight down shows gRPC as a public API in the low coherence, high intrusion quadrant. Intrusion becomes unwelcome and the coherence it bought is lost.</desc>

  <defs>
    <marker id="arrowhead" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#3c4043"/>
    </marker>
  </defs>

  <rect width="900" height="740" fill="#ffffff"/>

  <!-- Quadrant fills (muted so the story stands out) -->
  <rect x="90"  y="50"  width="380" height="300" fill="#f3f9f5"/>
  <rect x="470" y="50"  width="380" height="300" fill="#e3edfa"/>
  <rect x="90"  y="350" width="380" height="300" fill="#f7f8f8"/>
  <rect x="470" y="350" width="380" height="300" fill="#fce8e6"/>

  <!-- Grid lines -->
  <rect x="90" y="50" width="760" height="600" fill="none" stroke="#5f6368" stroke-width="1.5"/>
  <line x1="470" y1="50" x2="470" y2="650" stroke="#5f6368" stroke-width="1.5"/>
  <line x1="90" y1="350" x2="850" y2="350" stroke="#5f6368" stroke-width="1.5"/>

  <!-- Quadrant names -->
  <g font-size="14" font-weight="700" letter-spacing="1">
    <text x="110" y="82"  fill="#8fb79a">OPEN STANDARD</text>
    <text x="830" y="82"  fill="#1a56b0" text-anchor="end">OPINIONATED PLATFORM</text>
    <text x="110" y="382" fill="#9aa0a6">FREE-FOR-ALL</text>
    <text x="830" y="382" fill="#b3261e" text-anchor="end">WORST OF BOTH</text>
  </g>

  <!-- The shift: arrow from internal to public -->
  <line x1="540" y1="190" x2="540" y2="512" stroke="#3c4043" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round" marker-end="url(#arrowhead)"/>

  <!-- Internal gRPC -->
  <circle cx="540" cy="170" r="13" fill="#1a56b0" stroke="#ffffff" stroke-width="3"/>
  <g fill="#202124">
    <text x="566" y="166" font-size="16" font-weight="700" fill="#1a56b0">gRPC inside a monorepo</text>
    <text x="566" y="188" font-size="13">Welcome intrusion: shared schemas,</text>
    <text x="566" y="206" font-size="13">one toolchain, standard middleware</text>
  </g>

  <!-- Public gRPC -->
  <circle cx="540" cy="532" r="13" fill="#b3261e" stroke="#ffffff" stroke-width="3"/>
  <g fill="#202124">
    <text x="566" y="528" font-size="16" font-weight="700" fill="#b3261e">gRPC as a public API</text>
    <text x="566" y="550" font-size="13">Unwanted intrusion: code generators,</text>
    <text x="566" y="568" font-size="13">runtime dependencies, language limits</text>
  </g>

  <!-- Annotations along the arrow -->
  <g fill="#202124">
    <text x="566" y="412" font-size="14" font-weight="700">Same technology,</text>
    <text x="566" y="431" font-size="14" font-weight="700">different context</text>
    <text x="566" y="457" font-size="13" font-style="italic">Intrusion becomes unwelcome.</text>
    <text x="566" y="476" font-size="13" font-style="italic">The coherence it bought is gone.</text>
  </g>

  <!-- Vertical axis (Coherence) -->
  <g fill="#202124" text-anchor="middle">
    <text transform="translate(34 350) rotate(-90)" font-size="16" font-weight="700" letter-spacing="2">COHERENCE</text>
    <text transform="translate(66 80) rotate(-90)" font-size="13" fill="#5f6368">HIGH</text>
    <text transform="translate(66 620) rotate(-90)" font-size="13" fill="#5f6368">LOW</text>
  </g>

  <!-- Horizontal axis (Intrusion) -->
  <g fill="#202124" text-anchor="middle">
    <text x="470" y="707" font-size="16" font-weight="700" letter-spacing="2">INTRUSION</text>
    <text x="130" y="682" font-size="13" fill="#5f6368">LOW</text>
    <text x="810" y="682" font-size="13" fill="#5f6368">HIGH</text>
  </g>
  <line x1="190" y1="678" x2="750" y2="678" stroke="#9aa0a6" stroke-width="1.5"/>
  <polygon points="190,673 180,678 190,683" fill="#9aa0a6"/>
  <polygon points="750,673 760,678 750,683" fill="#9aa0a6"/>
</svg>
